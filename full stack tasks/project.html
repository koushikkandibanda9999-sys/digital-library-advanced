<!DOCTYPE html>
<html>
<head>
<title>Digital Library Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: 'Segoe UI', sans-serif;
}

body{
display:flex;
height:100vh;
background: linear-gradient(135deg,#1e3c72,#2a5298);
}

/* LOGIN CONTAINER */
.container{
display:flex;
width:100%;
}

/* LEFT SIDE IMAGE */
.left{
flex:1;
background:url('https://images.unsplash.com/photo-1524995997946-a1c2e315a42f') no-repeat center;
background-size:cover;
}

/* RIGHT SIDE LOGIN */
.right{
flex:1;
display:flex;
justify-content:center;
align-items:center;
background: rgba(255,255,255,0.1);
backdrop-filter: blur(10px);
}

.login-box{
background: rgba(255,255,255,0.2);
padding:40px;
border-radius:20px;
width:350px;
color:white;
box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

.login-box h2{
text-align:center;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
outline:none;
}

.login-box button{
width:100%;
padding:12px;
background:#00c6ff;
border:none;
border-radius:10px;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.login-box button:hover{
background:#0072ff;
}

/* DASHBOARD */
.dashboard{
display:none;
padding:20px;
color:white;
width:100%;
}

.card{
background:rgba(255,255,255,0.15);
padding:20px;
margin:10px 0;
border-radius:15px;
}

input[type="date"], input[type="text"]{
padding:8px;
border-radius:8px;
border:none;
margin:5px;
}

table{
width:100%;
margin-top:15px;
border-collapse:collapse;
}

th,td{
padding:10px;
background:rgba(255,255,255,0.2);
text-align:center;
}
</style>
</head>

<body>

<div class="container" id="loginPage">

<div class="left"></div>

<div class="right">
<div class="login-box">
<h2>Library Login</h2>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">

<h1>📚 Digital Library Dashboard</h1>

<div class="card">
<h3>Issue Book</h3>
<input type="text" id="bookName" placeholder="Book Name">
<input type="date" id="issueDate">
<input type="date" id="returnDate">
<button onclick="addBook()">Add</button>
</div>

<div class="card">
<h3>Issued Books</h3>
<table id="bookTable">
<tr>
<th>Book</th>
<th>Issue Date</th>
<th>Return Date</th>
<th>Late Days</th>
</tr>
</table>
</div>

</div>

<script>

function login(){
let user = document.getElementById("username").value;
let pass = document.getElementById("password").value;

if(user==="admin" && pass==="1234"){
document.getElementById("loginPage").style.display="none";
document.getElementById("dashboard").style.display="block";
}
else{
alert("Invalid Login");
}
}

function addBook(){

let book = document.getElementById("bookName").value;
let issue = new Date(document.getElementById("issueDate").value);
let returnD = new Date(document.getElementById("returnDate").value);

let today = new Date();

let lateDays = 0;

if(today > returnD){
lateDays = Math.floor((today - returnD)/(1000*60*60*24));
}

let table = document.getElementById("bookTable");

let row = table.insertRow();
row.insertCell(0).innerHTML = book;
row.insertCell(1).innerHTML = issue.toDateString();
row.insertCell(2).innerHTML = returnD.toDateString();
row.insertCell(3).innerHTML = lateDays + " days";

}

</script>

</body>
</html>
